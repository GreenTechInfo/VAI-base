<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База ВУ — ЕИС ВАИ</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="eis-wrapper">
        <!-- МЕСТА ПОД ШАПКУ / НАВИГАЦИЮ / ПОДВАЛ -->
        <div id="site-header"></div>
        <div id="site-nav"></div>

        <main class="eis-main">
            <div class="eis-container">
                <div class="eis-page-header">
                    <h1 class="eis-page-title">База данных военных удостоверений</h1>
                    <div class="eis-page-subtitle">Поиск и просмотр информации о выданных ВУ</div>
                </div>

                <div class="eis-panel">
                    <div class="eis-panel-header">
                        <span class="eis-panel-title">Параметры поиска</span>
                    </div>
                    <div class="eis-panel-body">
                        <form class="eis-search-form" id="searchForm" onsubmit="return false;">
                            <div class="eis-form-row">
                                <div class="eis-form-group">
                                    <label class="eis-form-label">ФИО</label>
                                    <input type="text" class="eis-input" id="searchFIO" placeholder="Введите ФИО">
                                </div>
                                <div class="eis-form-group">
                                    <label class="eis-form-label">Номер ВУ</label>
                                    <input type="text" class="eis-input" id="searchVU" placeholder="Введите номер">
                                </div>
                                <div class="eis-form-group">
                                    <label class="eis-form-label">Кем выдано</label>
                                    <input type="text" class="eis-input" id="searchIssued" placeholder="ФИО инспектора">
                                </div>
                            </div>
                            <div class="eis-form-row">
                                <div class="eis-form-group">
                                    <label class="eis-form-label">Дата с</label>
                                    <input type="date" class="eis-input" id="searchDateFrom">
                                </div>
                                <div class="eis-form-group">
                                    <label class="eis-form-label">Дата по</label>
                                    <input type="date" class="eis-input" id="searchDateTo">
                                </div>
                                <div class="eis-form-group">
                                    <label class="eis-form-label">Статус</label>
                                    <select class="eis-select" id="searchStatus">
                                        <option value="">Все статусы</option>
                                        <option value="valid">Действительные</option>
                                        <option value="expiring">Истекающие</option>
                                        <option value="expired">Просроченные</option>
                                        <option value="archived">Архив</option>
                                    </select>
                                </div>
                                <div class="eis-form-group eis-form-group-btn">
                                    <label class="eis-form-label">&nbsp;</label>
                                    <button type="button" class="eis-btn eis-btn-danger" onclick="resetSearch()">Сбросить</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="eis-panel">
                    <div class="eis-panel-header">
                        <span class="eis-panel-title">Результаты поиска</span>
                        <span class="eis-badge" id="resultsCount">ЗАПИСЕЙ: 0</span>
                    </div>
                    <div class="eis-panel-body" id="results">
                        <div class="eis-loading">
                            <div class="eis-spinner"></div>
                            <span>Загрузка данных...</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <div id="site-footer"></div>
    </div>

    <div class="eis-modal" id="photoModal">
        <span class="eis-modal-close" onclick="closeModal()">×</span>
        <span class="eis-modal-nav eis-modal-prev" onclick="prevPhoto()">‹</span>
        <span class="eis-modal-nav eis-modal-next" onclick="nextPhoto()">›</span>
        <div class="eis-modal-content">
            <img id="modalImage" src="" alt="Документ">
            <div class="eis-modal-counter" id="modalCounter"></div>
        </div>
    </div>

    <!-- Модалка редактирования ВУ -->
    <div class="eis-modal-form" id="editVUModal">
        <div class="eis-modal-form-content" style="max-width: 700px;">
            <div class="eis-modal-form-header">
                <h3>Редактирование ВУ</h3>
                <span class="eis-modal-form-close" onclick="closeEditVUModal()">×</span>
            </div>
            <div class="eis-modal-form-body">
                <input type="hidden" id="evId">

                <div class="eis-form-row">
                    <div class="eis-form-group">
                        <label class="eis-form-label">Номер ВУ *</label>
                        <input type="text" class="eis-input" id="evNumber" required>
                    </div>
                    <div class="eis-form-group">
                        <label class="eis-form-label">Статус</label>
                        <select class="eis-select" id="evStatus">
                            <option value="active">Активно</option>
                            <option value="archived">Архив</option>
                        </select>
                    </div>
                </div>

                <div class="eis-form-group">
                    <label class="eis-form-label">Звание</label>
                    <input type="text" class="eis-input" id="evRank">
                </div>

                <div class="eis-form-row">
                    <div class="eis-form-group">
                        <label class="eis-form-label">Фамилия *</label>
                        <input type="text" class="eis-input" id="evLastName">
                    </div>
                    <div class="eis-form-group">
                        <label class="eis-form-label">Имя *</label>
                        <input type="text" class="eis-input" id="evFirstName">
                    </div>
                    <div class="eis-form-group">
                        <label class="eis-form-label">Отчество</label>
                        <input type="text" class="eis-input" id="evMiddleName">
                    </div>
                </div>

                <div class="eis-form-row">
                    <div class="eis-form-group">
                        <label class="eis-form-label">Дата выдачи *</label>
                        <input type="date" class="eis-input" id="evIssueDate">
                    </div>
                    <div class="eis-form-group">
                        <label class="eis-form-label">Действительно до *</label>
                        <input type="date" class="eis-input" id="evExpiryDate">
                    </div>
                </div>

                <div class="eis-form-group">
                    <label class="eis-form-label">Кем выдано</label>
                    <input type="text" class="eis-input" id="evIssuedBy">
                </div>

                <div class="eis-auth-error" id="evError"></div>
            </div>
            <div class="eis-modal-form-footer">
                <button type="button" class="eis-btn eis-btn-secondary" onclick="closeEditVUModal()">Отмена</button>
                <button type="button" class="eis-btn eis-btn-primary" id="evSaveBtn" onclick="saveEditVU()">
                    Сохранить
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/layout.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/guard.js"></script>
    <script src="js/main.js"></script>
    <script src="js/database.js"></script>
</body>
</html>
